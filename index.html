    "tag": "單元一",
    "source": "單元一 p.1–2、7–8；統整 p.4",
    "body": "<h3>先做操作，再看時間公式</h3><p>Johnson’s rule（Johnson 法則）適用於標準兩機流程式製程（Two-machine flow shop）：每件依序做 M₁、M₂，機台一次只做一件，作業不可中斷，無額外釋放、順序相依整備或阻塞等限制。</p><p>① 找所有未排工作在兩台機器上的最小加工時間。② 最小值在第一台，就放最前空位；在第二台，就放最後空位。③ 移除這件，重複直到排完。</p><h3>第二台什麼時候能開始？</h3><p>它必須同時等到「這件在第一台做好」和「第二台完成前一件」。兩個時刻取較晚者，才加上這件在第二台的加工時間。下式的 k−1 表示前一個排序位置。</p><div class=\"formula\">C₂,ₖ = max(C₁,ₖ, C₂,ₖ₋₁) + p₂,ₖ</div><div class=\"workedexample\"><strong>一起算一個小例子</strong><p>這件在第一台於時間 4 完成，但第二台忙到時間 6 才空下來；它在第二台要做 3 小時，因此只能從 6 開始，完成時間 = max(4,6)+3 = 9。</p></div><h3>哪些解法有最佳性保證？</h3><p>精確法在完成求解與證明後可以確認全域最佳（Global optimum），即所有可行解中最好。啟發式通常用較快規則取得好解，但一般無最佳保證。局部最佳（Local optimum）只表示在指定的附近改動方式中找不到更好解。一般多機問題不能直接套 Johnson 就宣稱最佳。</p><p>P 類是可用多項式時間求解的決策問題；NP 類是給定一份證明後可用多項式時間驗證的決策問題。「多項式時間」例如 n²、n³；相較之下，階乘 n! 成長很快。NP-hard 不代表不能求精確解，也不是已證明只能用指數時間；它描述一般問題的困難程度。</p>",

    "tag": "單元二",
    "source": "單元二 p.8–11；課本印刷 p.152–156",
    "body": "<h3>先學三個基本規則</h3><p><b>SPT：</b>加工時間短者先排。在本題庫基本單機條件下，最小化總完成時間、平均流程時間與平均延誤值。<br><b>EDD：</b>交期早者先排，最小化最大延誤值與最大延遲時間。<br><b>SWPT：</b>先算加工時間除以權重，商數小者先排；在正權重及基本單機條件下最小化總加權完成時間。</p><div class=\"workedexample\"><strong>一起算一個小例子</strong><p>兩件加工時間同為 4，權重為 1 與 2，則 p/w 分別為 4 與 2。SWPT 會先排權重 2 的那件。它保證的是加權完成時間目標，不是一般的加權延遲目標。</p></div><p>LPUL 反過來算 w/p，大者先排；在加工時間與權重皆為正時，與 SWPT 的主排序一致。SPT＋LPUL 是先看加工時間、相同才看 w/p；WT＋LPUL 則先看權重、相同才看 w/p。「相同時怎麼選」稱為解除均勢（Tie-breaking）。</p><h3>關鍵比率：還有多少時間，夠不夠做？</h3><p>先把交期減目前時間，得到距離交期還有多久；再除以這件要加工多久。每排入一件，都要更新目前時間並重算；這稱為動態法則（Dynamic rule）。一次排序後不重算則是靜態法則（Static rule）。</p><div class=\"formula\">CRⱼ = (dⱼ − t) / pⱼ　→ 小者先</div><div class=\"workedexample\"><strong>一起算一個小例子</strong><p>目前時間 4，交期 10，加工要 3：CR = (10−4)/3 = 2，表示剩餘時間是加工時間的兩倍。若交期改為 5，CR = 1/3，小於 1，表示現在立即做也來不及。CR=1 剛好壓線；負值表示已超過交期。</p></div><h3>COVERT：急迫程度 × 每單位加工時間的權重</h3><p>先用 PR 表示交期急迫程度，再乘上 w/p 得到比較分數 CF。挑 CF 最大者，排完後更新 ST、RT，再重算未排工作的分數。以下使用本課版本。</p><div class=\"formula\">CFⱼ = PRⱼ × wⱼ / pⱼ<br>若 dⱼ ≤ ST + pⱼ：PRⱼ = 1<br>若 ST + pⱼ &lt; dⱼ &lt; TT：PRⱼ = (TT − dⱼ) / (RT − pⱼ)<br>若 dⱼ ≥ TT：PRⱼ = 0</div><p>第一種是現在接著做就已遲交或剛好到期；第三種是即使放最後也不晚；中間才需要計算。最後只剩一件直接排入，避免分母為 0。</p><div class=\"workedexample\"><strong>一起算一個小例子</strong><p>TT=12、ST=2、RT=10，某件 p=2、d=8、w=4。因為 4&lt;8&lt;12，PR=(12−8)/(10−2)=0.5；CF=0.5×4/2=1。要和其他未排工作的 CF 比較，才能決定誰先。</p></div>",

    "body": "<h3>先理解兩種界線</h3><p><b>下界 LB</b> 不是答案，而是「這條分支再怎麼好，成本也不會低於此值」。<b>上界 UB</b> 則來自一份完整可行排序，是目前最好答案的成本。還沒有完整答案時，先把 UB 設為無限大（Infinity，記作 ∞）。</p><h3>倒排時，為什麼可以先算最後一件？</h3><p>這裡的「後綴（Suffix）」是已固定在尾端的一段工作。所有工單從 0 連續加工時，未排工單都放在它前面；未排工單總時間就是目前最後空位的完成時間。先只計已固定工作的延遲，其他未排工作的成本暫估為 0，就得到有效的樂觀下界。</p><div class=\"formula\">新 LB = g + wⱼ × max(0, P(U) − dⱼ)</div><div class=\"workedexample\"><strong>一起算一個小例子</strong><p>尚未排工作的加工時間合計為 6；試把交期 3、權重 1 的 J1 放最後，且尚無固定後綴成本。下界 = 0 + 1×max(0,6−3) = 3。這個 3 只計最後一件，還不能當成整題答案。</p></div><h3>再決定展開、更新，或剪枝</h3><p>分枝（Branching）是把不同選擇分開，例如「誰放最後」各是一條分支。展開（Expansion）是繼續決定更前面的位置。回溯（Backtracking）是走完或排除一支後，回頭檢查其他選擇。剪枝（Pruning）是停止探索不可能改善的分支。</p><p>若已排成完整排序，才能用完整成本更新 UB。若某節點 LB 已大於或等於 UB，就不可能找到更低成本；若 LB 小於 UB 且未排完，仍須探索。</p><div class=\"formula\">LB ≥ UB → 剪枝（只找一個最佳解時）</div><div class=\"workedexample\"><strong>一起算一個小例子</strong><p>手上已有完整排序成本 6；另一分支的下界 9，可以剪掉。若下界是 5，就仍可能改善，不能直接剪掉，也不能把 UB 改為 5。</p></div><p>若要找出全部同值最佳排序，等號的剪枝方式要另外處理。不同探索順序可以合法，只要不漏掉仍可能改善的分支並正確計算界線。</p>",

    "desc": "二元變數如何避免機台重疊？",

    "source": "單元二 p.7；統整 p.8",
    "body": "<h3>為什麼需要 0／1 變數？</h3><p>對每對不同工單，只需二選一：i 先或 j 先。以 xᵢⱼ=1 表示 i 在 j 前，=0 表示 j 在 i 前。只對 i&lt;j 建變數，是為了避免把同一對再建一次，並不是強迫工作編號小的一定先做。</p><p>C、T 可以是連續變數（Continuous variables），表示時間不必限整數；x 是二元變數（Binary variable），只取 0、1。因此這是「混合整數」模型。目標是讓全部加權延遲成本最低。</p><div class=\"formula\">min Z = ΣwⱼTⱼ</div><h3>兩條不重疊限制，一次只啟用一個方向</h3><p>以下 ≤ 表示「小於或等於」，≥ 表示「大於或等於」，∈ 表示「屬於」。大 M 讓暫時不用的限制變寬鬆；選定先後後，另一條就會要求後面的工作等前面做完。</p><div class=\"formula\">對每對 i &lt; j：<br>Cᵢ + pⱼ ≤ Cⱼ + M(1 − xᵢⱼ)<br>Cⱼ + pᵢ ≤ Cᵢ + Mxᵢⱼ</div><div class=\"workedexample\"><strong>一起算一個小例子</strong><p>若 x₁₂=1，第一條變成 C₁+p₂≤C₂。假設 J1 在時間 2 完成，J2 要做 3 小時，就必須 C₂≥5，表示 J2 不能和 J1 重疊。第二條在有效 M 下被放鬆。</p></div><h3>再把延遲量與最早完工補齊</h3><p>延遲不能小於「完工減交期」，也不能小於 0；開始時間不能早於 0，所以完成時間不能小於自己的加工時間。</p><div class=\"formula\">Tⱼ ≥ Cⱼ − dⱼ；Tⱼ ≥ 0<br>Cⱼ ≥ pⱼ；xᵢⱼ ∈ {0,1}</div><p>當權重為正而且目標最小化時，模型會把 T 壓到剛好符合下限，也就是 max(0,C−d)。如果權重為 0，該 T 不一定壓緊，報告延遲量時應由 C 重算。</p><h3>M 不是隨便給一個超大數</h3><p>在所有工作 r=0、僅罰延遲、沒有額外限制的基本問題，可設 H=全部 p 合計，加入 Cⱼ≤H，再取 M=H。加入釋放時間、整備或提前成本後，需要重新推導有效範圍。3 件工作有 3 對，n 件則有 n(n−1)/2 個成對二元變數。</p>",

    "type": "B",
    "source": "單元二 p.12–14；課本印刷 p.156–160",
    "body": "<h3>第一階段：由後往前填位置</h3><p>Backward（後向建構）先決定最後一件，再決定倒數第二件。每一步先算剩餘加工時間 P（Remaining processing time，此處的合計符號），把它當成目前最後空位的完成時間，再試每件放在這裡的成本。</p><div class=\"formula\">qⱼ = wⱼ × max(0, P − dⱼ)</div><p>選 q 最小者放目前最後空位，移除它，再重算 P。如果分數一樣，按事先說好的均勢規則選；網站入門題選加工時間較長者，考古題依解答版本選編號較小者。</p><div class=\"workedexample\"><strong>一起算一個小例子</strong><p>總時間 P=6，三件工單的尾端成本為 J1=3、J2=5、J3=10，因此 J1 放最後。這只是當下的貪婪選擇（Greedy choice），不是把所有後續可能性都算過。入門例題最後得到 3→2→1，成本 6。</p></div><h3>第二階段：交換兩個位置，看有沒有更好</h3><p>Forward（前向改善）嘗試交換。間隔 k 從 n−1 逐漸降到 1，同一間隔由左到右檢查。成本變低就接受（Accept），否則拒絕（Reject）。接受後從新順序重新以最大間隔搜尋；拒絕後仍保留原本順序。</p><div class=\"workedexample\"><strong>一起算一個小例子</strong><p>入門例題從 3→2→1（成本 6），交換位置 2、3，成為 3→1→2（成本 5）。因為 5 比 6 小，接受此交換，接著從新的順序重新檢查。</p></div><p>本網站採嚴格改善（Strict improvement）：成本必須更低才接受，避免同值交換來回循環。教材也有接受同值交換的版本，使用時必須另處理循環。非相鄰交換可能改變中間工單完成時間，因此候選整體成本要重算。</p><h3>什麼時候停止？</h3><p>目前順序的所有指定交換都試過且無改善，才停止。這稱為交換鄰域（Swap neighborhood）內沒有更好解；不能因此宣稱全域最佳（Global optimum）。本題庫另外逐一列出全部排列核對，才知道這些例題剛好達到最佳值。</p>",

    "source": "單元二 p.15–17；課本印刷 p.162–166",
    "body": "<h3>先算時間差，再算錢</h3><p>提前時間 E 是交期減完成時間的正值；延遲時間 T 則是完成時間減交期的正值。a、b 分別是每單位提前、延遲的成本率；每件先算 aE+bT，再加總成 Z。</p><div class=\"formula\">Z = Σ(aⱼEⱼ + bⱼTⱼ)<br>Eⱼ = max(0, dⱼ − Cⱼ)<br>Tⱼ = max(0, Cⱼ − dⱼ)</div><div class=\"workedexample\"><strong>一起算一個小例子</strong><p>交期 10，提前成本率 a=2、延遲成本率 b=3。若時間 8 完成，E=2、T=0，成本 4；若時間 12 完成，E=0、T=2，成本 6。</p></div><h3>方法框架可沿用，評分方式要換</h3><p>B/F 仍可試工單交換，但候選成本必須改用新的提前＋延遲目標。課堂修改的後向建構法：若目前存在提前工單，優先把提前成本最大的放目前最後空位；沒有提前工單時，選延遲成本最小者。這仍是啟發式，沒有一般最佳保證。</p><h3>晚一點開工，可能反而省錢</h3><p>閒置時間（Idle time）是機台有空卻暫不加工的時段。只罰延遲時，故意等待通常無益；提前也罰時則可能有益。</p><div class=\"workedexample\"><strong>一起算一個小例子</strong><p>只有一件工作，加工要 2 小時、交期 10，提前成本率為 1。從 0 開始，時間 2 完成，提前成本為 8。若題目允許等待，時間 8 才開始，就在 10 完成，成本降為 0。</p></div><p>本題庫的五大題型不安排閒置。遇到提前成本擴充題，應先寫清楚是否允許等待；若允許，僅找連續加工的最佳排列還不夠。</p>",

    "tag": "單元三",
    "source": "單元三 p.2–4；課本印刷 p.171–178",
    "body": "<h3>共同到期日：大家共用一個日期</h3><p>CDD 表示所有 dⱼ 都等於 D。若 D 可決定，就需要一起選排序與交期；若客戶已指定 D，它就是已知條件，不能擅自改到比較便宜的日期。</p><p>固定一個排序後，各工作的完成時間就已知。把共同日期往前或往後移，可以重新算每件提前與延遲成本，再找總成本最小的位置。</p><div class=\"workedexample\"><strong>一起算一個小例子</strong><p>兩件工作分別在時間 4、8 完成，提前與延遲成本率都為 1。D=4 時總成本 0+4=4；D=6 時 2+2=4；D=8 時 4+0=4。這裡從 4 到 8 整段都是同值最佳交期，不一定只有一個日期。</p></div><p>在線性提前／延遲成本下，固定排序的成本曲線是凸的分段線性函數（Convex piecewise-linear function）：可想成許多直線段拼成的谷形，斜率在某件完成時刻可能改變。這些接點稱為折點（Breakpoint），可以在完成時刻找到至少一個最小值。課堂日期搜尋的 6% 是經驗搜尋範圍，不是誤差保證。</p><h3>交期區間：落在區間內就不罰</h3><p>交期視窗（Due window）用 ED、LD 表示最早與最晚可接受的完成時刻。先判斷 C 在區間前、區間內，還是區間後，再套對應成本。</p><div class=\"formula\">Cⱼ &lt; EDⱼ：成本 = aⱼ(EDⱼ − Cⱼ)<br>EDⱼ ≤ Cⱼ ≤ LDⱼ：成本 = 0<br>Cⱼ &gt; LDⱼ：成本 = bⱼ(Cⱼ − LDⱼ)</div><div class=\"workedexample\"><strong>一起算一個小例子</strong><p>可接受區間 [20,25]，a=2、b=3。C=18 時提早 2，成本 4；C=20 或 25 都不罰；C=28 時遲交 3，成本 9。</p></div><h3>如果偏離越多，罰得越快？</h3><p>非線性懲罰（Nonlinear penalty）表示成本不是固定比例增加。例如二次懲罰（Quadratic penalty）用平方；E² 就是 E×E。</p><div class=\"formula\">二次提前／延遲成本 = aⱼEⱼ² + bⱼTⱼ²</div><p>提前量從 2 變 4，平方部分會從 4 變 16。交換評估時要用新公式重算，不能沿用線性目標的最佳性定理。課本共同交期例表在 D=64 的成本應為 903，原表 843 為誤植；這是指定課堂資料的結果，不能套到其他工單。</p>",

    "desc": "移出的可能是剛才還準時的工單。",
    "tag": "E 類",
    "type": "E",
    "source": "單元三 p.5–6；課本印刷 p.179–180",
    "body": "<h3>每次超期，先找集合中最長的工單</h3><p>集合（Set）是一群目前保留的工作；被移出集合不代表取消生產，最後仍要放在尾段做。依下列步驟操作：</p><ol><li>先按 EDD 排列全部工作。</li><li>從空集合與 t=0 開始，依序加入下一件，並把它的加工時間加到 t。</li><li>若 t 大於這件交期，從「原保留集合＋新工作」中移出加工時間最長者，並從 t 扣回它的加工時間。</li><li>保留工作維持 EDD 順序放前面，移出者放後面，再計算完整排序。</li></ol><div class=\"workedexample\"><strong>一起算一個小例子</strong><p>先加入 J1（p=4、d=4），t=4，準時。再加入 J2（p=2、d=5），暫時 t=6，超過交期 5。要移出的是較長的 J1，不是剛加入的 J2；扣掉 4 後，t=2，保留 J2。J1 之後再排尾段。</p></div><h3>為什麼移出最長者？</h3><p>當必須少留一件時，移出最長者能留下最多可用時間，增加後續工作準時完成的機會。單純按 EDD 做到底只保證最大延遲的目標，不保證最少遲交件數。</p><div class=\"formula\">遲交件數 Nₜ = ΣUⱼ；Cⱼ &gt; dⱼ 時 Uⱼ=1，否則 Uⱼ=0</div><p>在本題庫單機、工作全部時間 0 可用、無額外限制的設定下，這是最小未加權遲交件數的精確演算法。未加權（Unweighted）表示每件遲交都只算 1；若每件遲交另有不同重要性，就不能直接沿用相同最佳性保證。</p>",

    "body": "<h3>先核對目標，不要只背縮寫</h3><p>① 想減少最嚴重的遲交，用 EDD；想減少遲交件數，還要做 Moore–Hodgson 的移除最長工單步驟。<br>② SWPT 的一般最佳性對應加權完成時間 ΣwC，不是加權延遲 ΣwT。<br>③ 平均 L 保留負值；計算 T 才把負的偏差改為 0。</p><div class=\"workedexample\"><strong>一起算一個小例子</strong><p>交期 10、時間 8 完成：C=8，L=−2，T=0。若求平均 L，把 −2 加進去；若求總延遲，就加 0。</p></div><h3>再核對方法的停止條件</h3><p>只有完整可行解可更新 UB；分支的 LB 只是樂觀估計。B/F 接受改善後要從新排序重新檢查；全部指定交換都沒有改善，也不等於證明全域最佳。交換時加工時間、交期、權重都跟著工單編號移動，不能固定在原來的欄位。</p><h3>課堂資料的數值勘誤</h3><p>下列排序數字是工作編號，例如 1→4→3→2 表示先做工作 1，再做 4、3、2。</p><p>課堂前後向例題：1→4→3→2 的成本應為 490；1→4→2→3 為 512。共同交期課堂例：初始排序在 D=64 的成本應為 903。考古題 B01 候選 1→3→4→2 的成本為 57；B02 的 2→1→3→4 為 46。這些數值只能對應各自的原始工單資料。</p><p>部分 2022、2023 題意由作答卷重建，不宣稱逐字還原。2022 年最少遲交件數題缺少資料，因此不補造。詳細數值差異可回查教材區的分類解答集第 22 頁。</p>",

</script><script>function evaluate(q,seq){let t=0;const rows=seq.map(j=>{const[p,d,w]=q.data[j-1],start=t; t+=p;const L=t-d,T=Math.max(0,L);return{j,p,d,w,start,C:t,L,T,wT:w*T,U:Number(T>0)};});return{rows,weighted:rows.reduce((s,r)=>s+r.wT,0),mean:rows.reduce((s,r)=>s+r.L,0)/seq.length,maxT:Math.max(...rows.map(r=>r.T)),count:rows.reduce((s,r)=>s+r.U,0)};}
function permutations(a){return a.length?a.flatMap((j,i)=>permutations(a.filter((_,k)=>k!==i)).map(t=>[j,...t])):[[]];}
function optimum(q){const field=TYPES[q.type].field;let best=Infinity,seqs=[];for(const seq of permutations(q.data.map((_,i)=>i+1))){const v=evaluate(q,seq)[field];if(v<best-1e-8){best=v;seqs=[seq];}else if(Math.abs(v-best)<1e-8)seqs.push(seq);}return{best,seqs};}
function stepsFor(q){const ids=q.data.map((_,i)=>i+1),steps=[];let seq=[];
 if(q.type==='A'){
  let ub=Infinity;function dfs(rem,suffix,g){const P=rem.reduce((s,j)=>s+q.data[j-1][0],0);const children=rem.map(j=>{const[p,d,w]=q.data[j-1];return{j,lb:g+w*Math.max(0,P-d),suffix:[j,...suffix]};}).sort((a,b)=>a.lb-b.lb||a.j-b.j);
   for(const c of children){const leaf=rem.length===1,action=c.lb>=ub?'剪枝':leaf?'更新 UB':'展開';steps.push({kind:'bb',title:'尾段 '+c.suffix.map(j=>'J'+j).join(' → '),context:`未排集合 {${rem.join(', ')}}；P = ${P}；固定後綴成本 g = ${g}；目前 UB = ${Number.isFinite(ub)?ub:'∞'}`,prompt:'計算此節點 LB，再判斷下一步。',fields:[{label:'LB',value:c.lb},{label:'動作',value:action,options:['展開','剪枝','更新 UB']}],why:`LB = ${g} + ${q.data[c.j-1][2]} × max(0, ${P} − ${q.data[c.j-1][1]}) = ${c.lb}。`+(action==='剪枝'?`LB ≥ UB，無法改善現有解。`:leaf?'這是完整排序，可以更新 UB。':'LB 小於 UB，且尚未排完，繼續展開。'),seq:c.suffix,depth:c.suffix.length,lb:c.lb,action});
    if(action==='更新 UB'){ub=c.lb;seq=c.suffix;}else if(action==='展開')dfs(rem.filter(j=>j!==c.j),c.suffix,c.lb);
   }
  }dfs(ids,[],0);
 }else if(q.type==='B'){
  let rem=[...ids];while(rem.length){const P=rem.reduce((s,j)=>s+q.data[j-1][0],0);const candidates=rem.map(j=>({j,cost:q.data[j-1][2]*Math.max(0,P-q.data[j-1][1])})).sort((a,b)=>a.cost-b.cost||(q.year==='入門'?q.data[b.j-1][0]-q.data[a.j-1][0]:a.j-b.j)||a.j-b.j),pick=candidates[0];seq.unshift(pick.j);
   steps.push({kind:'back',title:`倒排：決定第 ${rem.length} 個位置`,context:`P = ${P}；候選成本：${candidates.map(c=>'J'+c.j+' = '+c.cost).join('，')}`,prompt:'選擇放入目前最後空位的工單。',fields:[{label:'工單編號',value:pick.j,options:rem}],why:`最低成本為 ${pick.cost}，選 J${pick.j}。${q.year==='入門'?'均勢選 p 大者，再選編號小者。':'均勢選編號小者，依考古題解答版本。'}`,seq:[...seq]});rem=rem.filter(j=>j!==pick.j);
  }
  let changed=true;while(changed){changed=false;outer:for(let k=ids.length-1;k>=1;k--)for(let i=0;i<ids.length-k;i++){const candidate=[...seq];[candidate[i],candidate[i+k]]=[candidate[i+k],candidate[i]];const base=evaluate(q,seq).weighted,value=evaluate(q,candidate).weighted,accept=value<base;steps.push({kind:'swap',title:`交換位置 ${i+1} 與 ${i+k+1} · k = ${k}`,context:`現行 ${seq.join(' → ')}，成本 ${base}；候選 ${candidate.join(' → ')}`,prompt:'計算候選總加權延遲，決定是否接受。',fields:[{label:'候選 ΣwT',value},{label:'動作',value:accept?'接受':'拒絕',options:['接受','拒絕']}],why:`候選成本 ${value} ${accept?'<':'≥'} ${base}，${accept?'接受並從 k = n−1 重新搜尋':'保留目前排序，檢查下一個候選'}。`,seq:candidate});if(accept){seq=candidate;changed=true;break outer;}}
  }
 }else if(q.type==='C'||q.type==='D'){
  const ix=q.type==='C'?0:1;seq=[...ids].sort((a,b)=>q.data[a-1][ix]-q.data[b-1][ix]||a-b);let t=0;seq.forEach((j,i)=>{const[p,d]=q.data[j-1];t+=p;const v=q.type==='C'?t-d:Math.max(0,t-d);steps.push({kind:'sort',title:`第 ${i+1} 個位置`,context:`尚未排入：${seq.slice(i).map(x=>'J'+x).join('、')}；已累積時間 ${t-p}`,prompt:`依 ${q.type==='C'?'SPT（p 小先）':'EDD（d 小先）'} 選下一件，並計算。均勢時本導覽採編號小先。`,fields:[{label:'工單',value:j,options:seq.slice(i)},{label:'C',value:t},{label:q.type==='C'?'L':'T',value:v}],why:`J${j} 的 C = ${t-p} + ${p} = ${t}；${q.type==='C'?`L = ${t} − ${d} = ${v}，負值保留。`:`T = max(0, ${t} − ${d}) = ${v}。`}`,seq:seq.slice(0,i+1)});});
 }else{
  const edd=[...ids].sort((a,b)=>q.data[a-1][1]-q.data[b-1][1]||a-b),kept=[],removed=[];let t=0;for(const j of edd){kept.push(j);const trial=t+q.data[j-1][0],due=q.data[j-1][1];let drop=0;if(trial>due){drop=[...kept].sort((a,b)=>q.data[b-1][0]-q.data[a-1][0]||a-b)[0];kept.splice(kept.indexOf(drop),1);removed.push(drop);}t=trial-(drop?q.data[drop-1][0]:0);steps.push({kind:'moore',title:`加入 J${j}`,context:`暫時集合 {${[...kept,...(drop?[drop]:[])].join(', ')}}；加入後 t = ${trial}；d${j} = ${due}`,prompt:'是否需要移出？輸入移出工單（不移出選 0），以及調整後累積時間。',fields:[{label:'移出工單',value:drop,options:[0,...kept,...(drop?[drop]:[])]},{label:'調整後 t',value:t}],why:drop?`${trial} > ${due}，從整個集合移出最長的 J${drop}（p=${q.data[drop-1][0]}），t=${t}。`:`${trial} ≤ ${due}，保留全部候選，t=${t}。`,seq:[...kept],removed:[...removed]});}seq=[...kept,...edd.filter(j=>removed.includes(j))];
 }
 return{steps,seq,value:evaluate(q,seq)[TYPES[q.type].field]};
}
if(typeof module!=='undefined')module.exports={evaluate,permutations,optimum,stepsFor};
</script><script>// Static diagrams only: no playback, moving objects, frames, or simulated clock.
const DIAGRAM_FLOW=[{j:1,p:[2,4]},{j:2,p:[1,2]},{j:3,p:[3,1]}];
function diagramSchedule(jobs,seq,machines){const free=Array(machines).fill(0),ops=[];for(const j of seq){let ready=0;const job=jobs.find(x=>x.j===j);for(let m=0;m<machines;m++){const start=Math.max(ready,free[m]),end=start+job.p[m];ops.push({j,m,start,end,p:job.p[m],ready});free[m]=end;ready=end;}}return{ops,end:Math.max(...free)};}
function diagramChip(j,extra=''){return `<span class="diagramchip" style="--job:${colors[(j-1)%colors.length]}"><b>J${j}</b>${extra?`<small>${extra}</small>`:''}</span>`;}
function diagramMachine(title,text){return `<div class="diagrammachine"><svg viewBox="0 0 62 42" aria-hidden="true"><path d="M5 37h52M12 35V8h38v27M17 8V3h13v5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="17" y="15" width="13" height="11" rx="1" fill="currentColor" opacity=".15"/><circle cx="40" cy="22" r="6" fill="none" stroke="currentColor" stroke-width="2"/></svg><b>${title}</b><small>${text}</small></div>`;}
function diagramGantt(model,machines){const ticks=[...new Set([0,...model.ops.flatMap(o=>[o.start,o.end])])].sort((a,b)=>a-b);return `<figure class="diagramfigure"><figcaption>甘特圖（Gantt chart）：每列是一台機器，橫向是時間；同色是同一件工單。</figcaption><div class="diagramgantscroll"><div class="diagramgantt"><div class="diagramganttrow"><span></span><div class="diagramticks">${ticks.map(t=>`<span style="left:${t/model.end*100}%">${t}</span>`).join('')}</div></div>${Array.from({length:machines},(_,m)=>`<div class="diagramganttrow"><strong>M${m+1}</strong><div class="diagramtrack">${model.ops.filter(o=>o.m===m).map(o=>`<div class="diagramsegment" style="left:${o.start/model.end*100}%;width:${o.p/model.end*100}%;--job:${colors[(o.j-1)%colors.length]}"><b>J${o.j}</b><small>${o.start}–${o.end}</small></div>`).join('')}</div></div>`).join('')}</div></div><p class="diagramcaption">色塊下方的數字是「開始–完成」時刻，空白處表示機台閒置。本頁數值統一以小時解讀。</p></figure>`;}
function diagramSequence(seq){return `<div class="diagramsequence">${seq.map((j,i)=>`${i?'<span class="diagramarrow" aria-hidden="true">→</span>':''}${diagramChip(j)}`).join('')}</div>`;}
function diagramSection(title,text,body){return `<section class="panel diagramsection"><h2>${title}</h2><p class="diagramlead">${text}</p>${body}</section>`;}
function singleDiagram(){const q=QUESTIONS.find(q=>q.id==='C00'),seq=[2,3,1],ev=evaluate(q,seq),model=diagramSchedule(q.data.map((r,i)=>({j:i+1,p:[r[0]]})),seq,1);return diagramSection('一台機器：前一件做完，下一件才開始。','先看這張固定的排序圖。每件的加工時間會接在前一件後面，加到哪裡，那裡就是它的完成時刻。',`<div class="diagramvocab"><b>先認識符號：</b>J 是工單（Job）；M 是機台（Machine）；p 是加工時間（Processing time），d 是交期（Due date），C 是完成時間（Completion time）。</div><div class="diagrampipeline"><div>${diagramSequence(seq)}<small>依這個順序等候</small></div><span class="diagramarrow">→</span>${diagramMachine('M1｜一台機器','一次加工一件')}<span class="diagramarrow">→</span><div class="diagramout">✓<b>加工完成</b></div></div>${diagramGantt(model,1)}<div class="diagramsteps">${ev.rows.map((r,i)=>`<article><span class="diagramstepnum">${i+1}</span><div>${diagramChip(r.j)}<p>${i?`前一件在 ${r.start} 做完，接著做 ${r.p} 小時。`:`從時間 0 開始，做 ${r.p} 小時。`}<br><b>完成時刻 C = ${r.start} + ${r.p} = ${r.C}</b></p></div></article>`).join('')}</div><h3>做完的時刻，和交期比一比。</h3><p>L 是延誤值（Lateness），完成減交期，可正可負；T 是延遲時間（Tardiness），只計晚多少；E 是提前時間（Earliness），只計早多少。</p><div class="tablewrap"><table><thead><tr><th>工單</th><th>加工 p</th><th>交期 d</th><th>完成 C</th><th>延誤 L</th><th>延遲 T</th><th>提前 E</th></tr></thead><tbody>${ev.rows.map(r=>`<tr><td>J${r.j}</td><td>${r.p}</td><td>${r.d}</td><td>${r.C}</td><td>${r.L}</td><td>${r.T}</td><td>${Math.max(0,-r.L)}</td></tr>`).join('')}</tbody></table></div><div class="note" style="margin-top:18px">例如 J2 在 1 完成，交期是 2：提早 1，所以 L=−1、T=0、E=1。平均 L 要保留這個負值；本例平均 L = (−1+1+3)/3 = 1。</div><p class="source">資料對照：五大題型入門指南 C 類案例。本圖說明既定順序如何加工，不代替完整演算法搜尋。</p><a class="btn sm" href="#learn/symbols">回到符號觀念 →</a>`);}
function flowDiagram(){const model=diagramSchedule(DIAGRAM_FLOW,[1,2,3],2);return diagramSection('兩台機器：第二站要等兩件事。','這是一組自編的三件工單例子。每件都先做機台 1，再做機台 2；不同工單可以同時在不同機台加工。',`<div class="diagramvocab">J1、J2、J3 是三件工單（Job）；M1、M2 是兩台機台（Machine）。暫存區（Buffer）讓完成第一站的工單等待第二站。</div><div class="diagrampipeline">${diagramMachine('M1｜第一站','先完成這一道')}<span class="diagramarrow">→</span><div class="diagrambuffer"><span>▤</span><b>暫存區</b><small>第二站忙時先等</small></div><span class="diagramarrow">→</span>${diagramMachine('M2｜第二站','機台有空才能開始')}</div><div class="tablewrap"><table><thead><tr><th>工單</th><th>第一站加工時間</th><th>第二站加工時間</th></tr></thead><tbody>${DIAGRAM_FLOW.map(j=>`<tr><td>J${j.j}</td><td>${j.p[0]}</td><td>${j.p[1]}</td></tr>`).join('')}</tbody></table></div>${diagramGantt(model,2)}<h3>只看時間 3 這一刻。</h3><div class="diagramsnapshot"><div><small>第一站 M1</small>${diagramChip(3,'正在加工')}</div><div><small>暫存區</small>${diagramChip(2,'等第二站')}</div><div><small>第二站 M2</small>${diagramChip(1,'正在加工')}</div></div><div class="note" style="margin-top:18px"><strong>為什麼 J2 要等？</strong><br>J2 在第一站於時間 3 完成，但第二站還在做 J1，要到時間 6 才有空。因此 J2 等 3 小時，從 6 做到 8。先站完成，不代表下一站已經可用。</div><div class="diagramsteps"><article><span class="diagramstepnum">①</span><p>先看這件在前一站何時完成。</p></article><article><span class="diagramstepnum">②</span><p>再看下一台機器何時空下來。</p></article><article><span class="diagramstepnum">③</span><p>取兩個時刻中較晚的，才是下一站開始時刻。</p></article></div><p>最後 J3 在時間 9 完成，所以總工期（Makespan，也記作 Cₘₐₓ）為 9。不要把兩台機器的加工總量直接相加，因為有些時間兩台正同時加工。</p><a class="btn sm" href="#learn/environment">回到製程觀念 →</a>`);}
function johnsonDiagram(){const jobs=[{j:1,p:[5,1]},{j:2,p:[4,2]},{j:3,p:[3,3]},{j:4,p:[2,4]},{j:5,p:[1,5]}],remaining=[...jobs],slots=Array(5).fill(null),rows=[];let left=0,right=4;while(remaining.length){const pick=remaining.flatMap(j=>j.p.map((p,m)=>({j:j.j,p,m}))).sort((a,b)=>a.p-b.p||a.m-b.m||a.j-b.j)[0],position=pick.m===0?left++:right--;slots[position]=pick.j;rows.push({pick,slots:[...slots],position});remaining.splice(remaining.findIndex(j=>j.j===pick.j),1);}return diagramSection('Johnson：先決定誰放前，誰放後。','標準兩台機器的流程式製程，可以用 Johnson 法則（Johnson’s rule）選排序，讓全部工單盡早完成。先找未排工單兩站加工時間的最小值。',`<div class="diagramrulepair"><div><b>最小值在第一站</b><span>→ 放最前空位</span></div><div><b>最小值在第二站</b><span>放最後空位 ←</span></div></div><p class="small muted">工單用 J 加編號表示。下表是兩站加工時間（小時）；每排入一件，就從候選資料移除。遇到同值，本例先選第一站，再按工單編號。</p><div class="tablewrap"><table><thead><tr><th>工單</th>${jobs.map(j=>`<th>J${j.j}</th>`).join('')}</tr></thead><tbody><tr><td>第一站</td>${jobs.map(j=>`<td>${j.p[0]}</td>`).join('')}</tr><tr><td>第二站</td>${jobs.map(j=>`<td>${j.p[1]}</td>`).join('')}</tr></tbody></table></div><div class="diagramsteps">${rows.map((r,i)=>`<article><span class="diagramstepnum">${i+1}</span><div><p>選 <b>J${r.pick.j}</b>，最小值是第 ${r.pick.m+1} 站的 ${r.pick.p} 小時 → 放${r.pick.m===0?'最前':'最後'}空位。</p><div class="diagramslots">${r.slots.map((j,k)=>`<span class="${j?'filled':''} ${k===r.position?'chosen':''}" style="--job:${j?colors[(j-1)%5]:'#9ca48e'}">${j?'J'+j:'空'}</span>`).join('')}</div></div></article>`).join('')}</div><div class="note">最後順序為 J5 → J4 → J3 → J2 → J1，這組課堂資料的最小總工期為 16。一般三台以上的情況，不能直接沿用此法就宣稱最佳。</div><a class="btn sm" style="margin-top:18px" href="#learn/johnson">回到方法與適用條件 →</a>`);}
function mooreDiagram(){const q=QUESTIONS.find(q=>q.id==='E00'),seq=[2,3,4,1],result=evaluate(q,seq);return diagramSection('超期時：移出整個集合中最長的工作。','Moore–Hodgson 演算法先依最早到期日優先（Earliest Due Date，EDD）加入工單。只想減少「幾件遲交」時，一旦超期，移出的是目前集合中加工最久的那件。',`<div class="tablewrap"><table><thead><tr><th>工單</th>${q.data.map((_,i)=>`<th>J${i+1}</th>`).join('')}</tr></thead><tbody><tr><td>加工時間</td>${q.data.map(r=>`<td>${r[0]}</td>`).join('')}</tr><tr><td>交期</td>${q.data.map(r=>`<td>${r[1]}</td>`).join('')}</tr></tbody></table></div><div class="diagramsteps"><article><span class="diagramstepnum">1</span><div><h3>加入 J1：還沒超期</h3>${diagramChip(1,'加工 4')}<p>累積時間 4，交期也是 4，先保留。</p></div></article><article class="diagramwarning"><span class="diagramstepnum">2</span><div><h3>再加入 J2：發現超期</h3>${diagramChip(1,'加工 4')} ${diagramChip(2,'加工 2')}<p>累積時間 4+2=6，超過 J2 的交期 5。現在比較整個集合，誰的加工時間最長？</p></div></article><article><span class="diagramstepnum">3</span><div><h3>移出 J1，留下 J2</h3><div class="diagramcompare"><div><small>留下</small>${diagramChip(2,'加工 2')}</div><div><small>移到尾段</small>${diagramChip(1,'加工 4')}</div></div><p>移出較長的 J1，時間扣回：6−4=2。<b>移出的不是剛加入的 J2。</b></p></div></article></div><p>接著加入 J3，累積時間變 3；再加入 J4，變 6，兩件都沒有超期。保留工作排前面，被移出的 J1 放尾段，仍然要加工。</p>${diagramSequence(seq)}<div class="tablewrap"><table><thead><tr><th>工單</th><th>完成時刻</th><th>交期</th><th>是否遲交</th></tr></thead><tbody>${result.rows.map(r=>`<tr><td>J${r.j}</td><td>${r.C}</td><td>${r.d}</td><td>${r.T?'遲交':'準時'}</td></tr>`).join('')}</tbody></table></div><div class="note" style="margin-top:18px">最後只有 J1 遲交，最少遲交件數為 1。這是「未加權遲交件數」目標，每件遲交只算 1；不等於把遲交時間加總。</div><a class="btn sm" style="margin-top:18px" href="#learn/moore">回到演算法說明 →</a>`);}
function diagrams(){const mode=location.hash.split('/')[1]||'single',sections={single:singleDiagram,flow:flowDiagram,johnson:johnsonDiagram,moore:mooreDiagram};return header('ILLUSTRATED NOTES / 圖示學習','一張圖，一個重點。','照自己的速度看固定圖解；每一步都留在畫面上，方便對照。')+`<nav class="diagramnav" aria-label="圖示主題">${[['single','單機與完成時間'],['flow','兩台機器與等待'],['johnson','Johnson 排序'],['moore','超期移出最長者']].map(([k,t])=>`<a class="pill ${mode===k?'on':''}" href="#diagrams/${k}">${t}</a>`).join('')}</nav>`+(sections[mode]||singleDiagram)();}

</script><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STORE='scheduling-lab-v1';let storageOK=true;const fresh=()=>({records:{},lessons:{},last:'A00'});let saved;try{saved=JSON.parse(localStorage.getItem(STORE))||fresh();if(!saved.records||!saved.lessons)saved=fresh();}catch{saved=fresh();storageOK=false;}

function hero(){return`<section class="hero"><div><div class="eyebrow">LESS THEORY ANXIETY. MORE CLARITY.</div><h1>從看懂觀念，<br>到排出你的解答。</h1><p>把筆記、課本與考古題串在一起。<br>動手排一次，讓抽象的演算法變成看得見的步驟。</p><div class="actions heroactions"><button class="btn primary" data-start="${esc(saved.last||'A00')}">繼續學習 <span>→</span></button><a class="btn light" href="#learn">先看觀念 <span>↗</span></a></div><p style="font-size:10px;margin:13px 0 0;color:#8a987d">單機排程起步 · 先學小例題，再挑戰考古題</p></div><div class="herovisual" aria-label="範例排序 J3、J1、J2 的甘特圖，總加權延遲 5"><div class="visualtitle"><span>A SMALL EXAMPLE, A CLEARER IDEA.</span><div class="visualdots"><i></i><i></i><i></i></div></div><div class="herochips"><span class="herochip on">J₃</span><span class="herochip">J₁</span><span class="herochip">J₂</span><span style="margin-left:auto;color:#93a180">↔</span></div><div class="herogantt"><div>J₃</div><div>J₁</div><div>J₂</div></div><div class="heroticks"><span>0</span><span>1</span><span>3</span><span>6</span></div><div class="herocaption"><span>J 表示工單；色塊長度表示加工時間。</span><span>總加權延遲 <b>5</b></span></div></div></section>`;}
function home(){const done=countMastered(),wrong=Object.values(saved.records).filter(r=>r.needsReview).length;return`<div class="breadcrumb">你的學習空間 / 總覽</div>${hero()}<section class="diagramhomebanner"><div><h3>用固定圖示，把每一步看清楚。</h3><p>單機、兩台機器的等待、Johnson 與移出最長者。</p></div><a class="btn primary" href="#diagrams">▧ 開啟圖示學習</a></section><div class="stats"><div class="stat"><span class="statnum">5</span><small>大題型</small><div class="statlabel">從方法理解到獨立解題</div></div><div class="stat"><span class="statnum">19</span><small>道練習</small><div class="statlabel">5 題入門 ＋ 14 題考古題</div></div><div class="stat"><span class="statnum">${done}<span style="font-size:14px;color:#a0a895"> / 19</span></span><div class="statlabel">已掌握的題目</div></div><div class="stat"><span class="statnum">${wrong}</span><small>題待複習</small><div class="statlabel">每一次錯誤都是線索</div></div></div><div class="sectionhead"><div><h2>五種題型，逐一拆解。</h2><p>從小數字開始，把方法練熟，再增加難度。</p></div><a class="textlink" href="#bank">查看全部練習 →</a></div><div class="typegrid">${Object.entries(TYPES).map(([k,t])=>`<a class="typecard" href="#bank/${k}" style="--type:${t.color}"><span class="typeletter">${k}</span><h3>${t.name}</h3><p>${t.short}</p><div class="typeformula">${objectiveWords(k)}</div><div class="cardfoot"><span>${QUESTIONS.filter(q=>q.type===k).length} 道練習</span><span>開始探索 ↗</span></div></a>`).join('')}</div><div class="lowergrid"><section class="panel"><h3>你的第一條學習路徑 <span class="eyebrow muted" style="float:right;font-size:8px">START HERE</span></h3>${[['01','分清完成、延誤、延遲與提前','先把共同語言準備好。','#learn/symbols'],['02','動手完成一題入門練習','逐步提示，理解每個決定。','#work/A00/tutorial'],['03','用考古題驗證自己','獨立作答，提交後找出錯因。','#work/A01/practice']].map(([n,t,d,h])=>`<a class="pathrow" href="${h}"><span class="pathnum">${n}</span><span class="pathtext"><b>${t}</b><small>${d}</small></span><span class="muted">→</span></a>`).join('')}</section><section class="panel" style="background:#edf0e3"><div class="eyebrow muted">A NOTE BEFORE YOU START</div><h3 style="font-family:var(--serif);font-size:20px;margin:14px 0">先問目標，再選方法。</h3><p class="small muted">平均延誤、最大延遲、遲交件數，雖然都在談「晚」，卻需要不同的解法。</p><a class="textlink" href="#learn/objectives">花 2 分鐘分清楚 →</a><div style="border-top:1px solid #d8dfc9;margin-top:18px;padding-top:14px" class="small muted">準備好了？ <button class="textlink" data-exam>開始五題混合測驗 ↗</button></div></section></div>`;}
function bank(){const qs=QUESTIONS.filter(q=>(state.type==='all'||q.type===state.type)&&(state.kind==='all'||q.kind===state.kind));return header('PRACTICE LIBRARY','把方法，練成自己的。','先做入門題，再挑戰不同年份；每道題目都能逐步練習。',`<button class="btn primary" data-exam>五題混合測驗 →</button>`)+`<div class="filters">${[['all','全部題型'],...Object.entries(TYPES).map(([k,t])=>[k,k+' '+t.name])].map(([k,n])=>`<button class="pill ${state.type===k?'on':''}" data-filter="${k}">${n}</button>`).join('')}</div><div class="actions" style="margin-bottom:20px">${['all','入門練習','考古題'].map(k=>`<button class="btn sm ${state.kind===k?'primary':''}" data-kind="${k}">${k==='all'?'所有難度':k}</button>`).join('')}<span class="small muted" style="margin-left:auto">共 ${qs.length} 題</span></div><div class="questions">${qs.map(q=>qcard(q)).join('')}</div><div class="note" style="margin-top:22px">共同設定：所有工單於時間 0 可用、單機、不可中斷、從 0 連續加工。2022／2023 部分題意由作答卷重建；不同方法共用數據時仍保留為不同練習。</div>`;}
function qcard(q){const r=rec(q.id);return`<article class="qcard"><div class="qtop"><span class="qbadge">${q.id===''+q.type+'00'?q.type+' · START':q.id}</span><span class="tag ${r.mastered?'success':''}">${r.mastered?'已掌握':q.kind}</span></div><h3>${TYPES[q.type].name}</h3><p>${q.year==='入門'?'小數字，先學會每一步':q.year+' 年 · '+q.provenance}<br>${q.data.length} 件工單 · 最小化${objectiveWords(q.type)}</p><div class="actions"><button class="btn sm primary" data-start="${q.id}">逐步學習 →</button><button class="btn sm" data-practice="${q.id}">獨立作答</button></div>${r.attempts?`<div class="qstatus">已作答 ${r.attempts} 次 · ${r.needsReview?'待複習':r.mastered?'方法與結果皆完成':'結果已答對，可補練步驟'}</div>`:''}</article>`;}

function termsView(keys,compact=false){return `<section class="termbox ${compact?'compactterms':''}" aria-label="本節中英文名詞與符號"><h3>先認識這些名詞與符號</h3><p class="termpreface">${compact?'可直接進入本題；遇到不熟的字母，先對照下表。':'不需要一次背完。先讀中文意思，後面遇到公式時可以回來對照。'}</p><dl class="termlist">${keys.map(key=>{const t=GLOSSARY[key];return `<div><dt>${esc(t[0])}｜${esc(t[1])}</dt><dd><span lang="en">${esc(t[2])}</span><br>${esc(t[3])}</dd></div>`;}).join('')}</dl></section>`;}
function workTerms(q){const basic=['j','p','d','w','C',q.type==='C'?'L':'T','sum','max'];if(q.type==='A')return [...basic,'weightedT','bb','LB','UB','unfinished','remainingP','g'];if(q.type==='B')return [...basic,'weightedT','bf','qcost','k','n','remainingP'];if(q.type==='C')return [...basic,'meanL','n','spt'];if(q.type==='D')return [...basic,'maxT','edd'];return [...basic,'indicator','edd','t'];}
function objectiveWords(type){return {A:'總加權延遲',B:'總加權延遲',C:'平均延誤值',D:'最大延遲時間',E:'遲交工作數'}[type];}
function taskIntro(q){return {A:'使用分枝界限法（Branch and Bound，B&B），找出總加權延遲最小的排序。過程中要比較下界（Lower bound，LB）與上界（Upper bound，UB），記錄為什麼展開或剪枝。',B:'使用前後向啟發式（Backward and Forward Heuristic，B/F），先由後往前建立完整排序，再交換工作位置，尋找更低的總加權延遲成本。',C:'找出平均延誤值（Mean lateness）最小的排序。每件先算完成時間減交期，保留負值，再加總並除以工作件數。',D:'找出最大延遲時間（Maximum tardiness）最小的排序。每件先算真正遲交多久，再挑其中最大的數值。',E:'找出遲交工作數（Number of tardy jobs）最少的完整排序。完成時間比交期晚就算一件，剛好到期不算遲交。'}[q.type];}

function learn(){const l=LESSONS.find(x=>x.id===state.lesson)||LESSONS[0];return header('CONCEPT CLASSROOM','先理解，再動手。','以筆記為主線，搭配課本補充與校正。')+`<div class="lessonlayout"><div class="lessonmenu">${LESSONS.map(x=>`<a href="#learn/${x.id}" class="lessonlink ${l.id===x.id?'active':''}"><small>${x.tag} ${saved.lessons[x.id]?'· ✓':''}</small>${x.title}</a>`).join('')}</div><article class="panel lessonbody"><span class="eyebrow muted">${l.tag} / CONCEPT NOTES</span><h2>${l.title}</h2><p class="lessonintro">${l.intro}</p>${diagramLessonLink(l.id)}${termsView(l.terms)}${l.body}<div class="quiz"><div class="eyebrow muted">CHECK YOUR UNDERSTANDING</div><h3 style="margin-top:12px">${l.quiz.q}</h3>${l.quiz.options.map((o,i)=>`<button class="quizoption ${state.quizResult!==null?(i===l.quiz.answer?'correct':state.quizResult===i?'wrong':''):''}" data-quiz="${i}">${String.fromCharCode(65+i)}　${o}</button>`).join('')}${state.quizResult!==null?`<div class="feedback ${state.quizResult===l.quiz.answer?'':'bad'}">${state.quizResult===l.quiz.answer?'答對了。':'再想一下。'}${l.quiz.why}</div>`:''}</div><div class="source">教材對照：${l.source}。完整來源與勘誤見「教材與來源」。</div><div class="actions"><button class="btn primary" data-start="${(l.type||({rules:'C',objectives:'C',moore:'E'}[l.id]||'A'))+'00'}">用一題練習理解 →</button>${LESSONS.indexOf(l)<LESSONS.length-1?`<a class="btn" href="#learn/${LESSONS[LESSONS.indexOf(l)+1].id}">下一個觀念</a>`:''}</div></article></div>`;}
function startWork(id,mode='tutorial'){const q=QUESTIONS.find(q=>q.id===id);if(!q)return;const flow=stepsFor(q);state.work={q,mode,tab:mode==='tutorial'?'steps':'solve',seq:q.data.map((_,i)=>i+1),flow,step:0,stepOK:false,stepError:false,stepAnswers:{},stepsDone:false,answers:{},result:null,showSolution:false,hint:0,started:Date.now()};saved.last=id;save();state.page='work';}
function jobsTable(q){return`<div class="tablewrap"><table><thead><tr><th>工作 j</th>${q.data.map((_,i)=>`<th>J${i+1}</th>`).join('')}</tr></thead><tbody>${[['加工時間 p',0],['交期 d',1],['權重 w',2]].map(([t,k])=>`<tr><td>${t}</td>${q.data.map(r=>`<td>${r[k]}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function gantt(q,seq){const rows=evaluate(q,seq).rows;return`<div class="ganttarea"><span class="ganttlabel">完成時間 C · 機台 M₁</span><div class="gantt">${rows.map(r=>`<div class="ganttbar" style="flex:${r.p};--jobcolor:${colors[(r.j-1)%5]}">J${r.j}<span>${r.C}</span></div>`).join('')}</div></div>`;}
function work(){const w=state.work,q=w.q,t=TYPES[q.type],exam=w.mode==='exam';return`<div class="breadcrumb"><a href="#bank">題型練習</a> / ${q.year} / ${q.id}</div><div class="workhead"><div><span class="eyebrow muted">${q.id} · ${t.en}</span><h1>${t.name}</h1><p class="small muted">${q.kind} · ${q.data.length} 件工單 · 最小化${objectiveWords(q.type)}</p></div><div class="actions">${exam?`<span class="tag">混合測驗 ${state.exam.index+1} / 5</span><span class="timer" id="timer">00:00</span><button class="btn sm danger" data-end-exam>結束測驗</button>`:`<select id="mode" class="pill" aria-label="作答模式"><option value="tutorial" ${w.mode==='tutorial'?'selected':''}>教學模式</option><option value="practice" ${w.mode==='practice'?'selected':''}>獨立練習</option></select><button class="btn sm" data-reset-work>重新開始</button>`}</div></div><div class="worklayout"><div class="workmain"><section class="panel"><div class="sectionhead" style="margin:0 0 14px"><h3 style="margin:0">題目資料</h3><span class="tag">單機 · ${q.data.length} 件工單</span></div><p class="taskintro">${taskIntro(q)}</p><p class="small muted">共同假設：每件工作最早可開始的時刻（Release time，r）都是 0；一台機器一次做一件，不能中途暫停，從時間 0 連續加工。以下記法「1 || 目標」的 1 表示單機，中間空白表示沒有列出額外限制。</p>${termsView(workTerms(q),true)}${jobsTable(q)}</section><section class="panel"><div class="tabs">${(exam?[['solve','作答工作台']]:[['steps','逐步操作'],['solve','排序與計算']]).map(([k,l])=>`<button class="tab ${w.tab===k?'active':''}" data-tab="${k}">${l}${k==='steps'&&w.stepsDone?' ✓':''}</button>`).join('')}</div>${w.tab==='steps'?stepView(w):solveView(w)}</section></div><aside class="workaside">${exam?`<section class="panel"><h3>獨立作答中</h3><p>每題提交後鎖定答案，五題完成後統一查看回饋。</p><p>可拖曳工單或使用左右按鈕排序，再填入計算表與目標值。</p></section>`:`<section class="panel"><div class="eyebrow muted">METHOD CARD</div><h3 style="margin-top:9px">${t.short}</h3><p>${t.rule}</p><a class="textlink" href="#learn/${{A:'bb',B:'bf',C:'rules',D:'rules',E:'moore'}[q.type]}">回到相關觀念 ↗</a></section><section class="panel"><h3>需要一點線索？</h3><p>${w.hint?hintText(q,w.hint):'先自己試試看。卡住時，可以分次打開提示。'}</p><button class="btn sm" data-hint ${w.hint>=3?'disabled':''}>${w.hint>=3?'提示已全部展開':'查看提示 '+Math.min(3,w.hint+1)+'/3'}</button></section>`}<section class="panel"><h3>教材對照</h3><p>${esc(q.source)} p.${q.pages}<br>${q.provenance||'自編簡化案例，非考古題'}</p>${q.type==='B'?`<p>均勢：${q.year==='入門'?'p 大者先，再看編號':'編號小者先'}。前向改善（Forward）只接受成本更低的交換。</p>`:''}<a class="textlink" href="#sources">查看來源與勘誤 ↗</a></section></aside></div>`;}
function hintText(q,n){const h={A:['先看尾端：誰放最後，誰的 C 就是全部 p 的合計。','只計已固定後綴的成本作為 LB；未排工單先以 0 估計。','完整解更新 UB，LB ≥ UB 的分支可剪去。'],B:['先由後往前填入工單，選擇目前尾端成本較小者。','Forward 從 k=n−1 開始，拒絕候選時保持目前排序。','接受較低成本的交換後，從新序列與 k=n−1 重算。'],C:['目標是平均 L，不是平均 T。','ΣL = ΣC − Σd，因此使用 SPT。','每件 L=C−d，負值照樣加總，最後除以 n。'],D:['目標是最大的延遲量，不是延遲總和。','用 EDD：d 小的先排。','每件 T=max(0,C−d)，最後取所有 T 的最大值。'],E:['依 EDD 順序逐件加入候選集合。','超期時比較整個集合的 p，不只比較剛加入者。','移除 p 最長者並扣回其時間，移出的工單最後排尾段。']}[q.type];return h.slice(0,n).map((t,i)=>`${i+1}. ${t}`).join('<br>');}
function stepView(w){const s=w.flow.steps[w.step];if(!s)return`<div class="feedback"><h3>方法走完了，現在換你完整算一次。</h3><p>你已完成 ${w.flow.steps.length} 個決策。${w.result?.correct?"排序與計算也已答對，這題已記為掌握。":"排序與目標值仍需在工作台獨立提交。"}</p></div>${gantt(w.q,w.flow.seq)}<button class="btn primary" data-tab="solve">前往排序與計算 →</button>${stepLog(w)}`;return`<div class="stepcounter"><span>步驟 ${String(w.step+1).padStart(2,'0')} / ${w.flow.steps.length}</span><span>${w.q.type==='A'?'由後往前固定尾段':w.q.type==='B'?'先倒排，再改善':'一步一步確認'}</span></div><div class="steptrack"><i style="width:${w.step/w.flow.steps.length*100}%"></i></div><h3>${s.title}</h3><div class="stepcontext">${s.context}</div><p class="small">${s.prompt}</p><div class="stepfields">${s.fields.map((f,i)=>`<div class="stepfield"><label for="step${i}">${f.label}</label>${f.options?`<select id="step${i}" data-step-field="${i}" ${w.stepOK?'disabled':''}><option value="">請選擇</option>${f.options.map(o=>`<option value="${esc(o)}" ${String(w.stepAnswers[i])===String(o)?'selected':''}>${typeof o==='number'?(o===0?'0 · 不移出':'J'+o):o}</option>`).join('')}</select>`:`<input id="step${i}" data-step-field="${i}" type="number" step="any" value="${esc(w.stepAnswers[i]??'')}" ${w.stepOK?'disabled':''}>`}</div>`).join('')}</div><div class="actions">${w.stepOK?`<button class="btn primary" data-next-step>${w.step+1===w.flow.steps.length?'完成操作':'下一步'} →</button>`:`<button class="btn primary" data-check-step>確認這一步 →</button>`}</div>${w.stepOK?`<div class="feedback"><b>這一步正確。</b><br>${s.why}</div>`:w.stepError?`<div class="feedback bad">還有欄位需要修正。${w.mode==='tutorial'?s.why:'重新檢查目標、集合與計算。需要提示可切換教學模式。'}</div>`:''}${stepLog(w)}`;}
function stepLog(w){if(!w.step)return'';return`<details class="steplog" ${w.q.type==='A'?'open':''}><summary>已完成的${w.q.type==='A'?'搜尋樹節點':'操作紀錄'}（${w.step}）</summary>${w.flow.steps.slice(0,w.step).map(s=>`<div class="logrow ${s.action==='剪枝'?'prune':''}" style="margin-left:${((s.depth||1)-1)*12}px">${s.title}${s.lb!==undefined?' · LB '+s.lb+' · '+s.action:''}<small>${s.why}</small></div>`).join('')}</details>`;}
function solveView(w){const q=w.q,ex=w.mode==='exam',explore=w.mode==='tutorial',result=evaluate(q,w.seq),fields=['C',q.type==='C'?'L':'T',...(['A','B'].includes(q.type)?['wT']:[])],f=TYPES[q.type].field;return`<div class="sectionhead" style="margin:0"><div><h3 style="margin:0">排出你的工單順序</h3><p>拖曳卡片，或用左右按鈕調整。${explore?'甘特圖（Gantt chart，用色塊表示工作占用時間）與參考值會同步更新。':'計算表先自己填，提交後核對。'}</p></div></div><div class="jobcards" id="jobcards">${w.seq.map((j,i)=>`<div class="job" draggable="${!w.result}" data-job="${j}"><span><b>J${j}</b><small>p=${q.data[j-1][0]} · d=${q.data[j-1][1]}</small></span><span><button data-move="${i},-1" aria-label="J${j} 向左移" ${i===0||w.result?'disabled':''}>‹</button><button data-move="${i},1" aria-label="J${j} 向右移" ${i===w.seq.length-1||w.result?'disabled':''}>›</button></span></div>`).join('')}</div>${explore?gantt(q,w.seq):''}${explore?`<div class="note" style="margin-bottom:18px">探索中的 ${TYPES[q.type].objective}：<b>${fmt(result[f])}</b>。提交時仍需完成下方計算，並找出更好的排序。</div>`:''}<div class="tablewrap"><table><thead><tr><th>工單</th><th>p 加工時間</th><th>d 交期</th>${fields.map(k=>`<th>${k} ${{C:"完成時間",L:"延誤值",T:"延遲時間",wT:"加權延遲"}[k]}</th>`).join('')}</tr></thead><tbody>${result.rows.map(r=>`<tr><td><b>J${r.j}</b></td><td>${r.p}</td><td>${r.d}</td>${fields.map(k=>{const key=r.j+'_'+k,a=w.answers[key],ok=w.result?.cells[key];return`<td><input type="number" step="any" aria-label="J${r.j} 的 ${k}" data-answer="${key}" value="${esc(a??'')}" class="${w.result?(ok?'valid':'invalid'):''}" ${w.result?'disabled':''}></td>`;}).join('')}</tr>`).join('')}</tbody></table></div><div class="inputline"><label for="objective">最終 ${TYPES[q.type].objective} =</label><input id="objective" type="number" step="any" data-objective value="${esc(w.answers.objective??'')}" ${w.result?'disabled':''}><span class="small muted">平均值可輸入小數</span></div><div class="actions" style="margin-top:21px">${w.result?`<button class="btn" data-retry>保留排序，重新作答</button>`:`<button class="btn primary" data-submit>${ex?'提交本題並繼續':'提交答案'} →</button>`}${!ex&&w.result?`<button class="btn" data-solution>${w.showSolution?'收起':'查看'}解析</button>`:''}</div>${w.result?resultView(w):''}${w.showSolution?solutionView(q):''}`;}
function resultView(w){const r=w.result;return`<div class="feedback ${r.correct?'':'bad'}"><h3>${r.correct?'排序與計算都正確。':'找到幾個值得回頭看的地方。'}</h3>${r.errors.map(e=>`<p>• ${e}</p>`).join('')}${r.correct?`<p>${w.stepsDone?'方法步驟也已完成，這題已掌握。':'結果答對了！完成「逐步操作」後，會記為方法與結果皆掌握。'}</p>`:''}<p class="small">你的排序目標值：${fmt(r.actual)}；此題枚舉最佳值：${fmt(r.best)}。${w.q.type==='B'?'本題可達此最佳值，但前後向啟發式（B/F）一般仍無最佳性保證。':''}</p></div>`;}
function solutionView(q){const flow=stepsFor(q),value=evaluate(q,flow.seq),op=optimum(q),fields=['C','L','T','wT'];return`<div class="answerblock"><h3>一組解答：${flow.seq.map(j=>'J'+j).join(' → ')}</h3><p class="small">${TYPES[q.type].objective} = ${fmt(value[TYPES[q.type].field])}。枚舉核對 ${q.data.length===5?'120':q.data.length===4?'24':'6'} 種排列；共有 ${op.seqs.length} 組同值最佳排序。</p>${gantt(q,flow.seq)}<div class="tablewrap"><table><thead><tr><th>工作</th>${fields.map(f=>`<th>${f}</th>`).join('')}</tr></thead><tbody>${value.rows.map(r=>`<tr><td>J${r.j}</td>${fields.map(f=>`<td>${fmt(r[f])}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small muted" style="margin-top:13px">${TYPES[q.type].rule}</p></div>`;}
function grade(w){const q=w.q,ev=evaluate(q,w.seq),op=optimum(q),fields=['C',q.type==='C'?'L':'T',...(['A','B'].includes(q.type)?['wT']:[])],cells={},errors=[];for(const row of ev.rows)for(const field of fields){const key=row.j+'_'+field,raw=w.answers[key],v=Number(raw);cells[key]=raw!==undefined&&raw!==''&&Number.isFinite(v)&&Math.abs(v-row[field])<1e-3;if(!cells[key])errors.push(`J${row.j} 的 ${field}：${raw===undefined||raw===''?'尚未填寫':`填入 ${raw}`}，應為 ${fmt(row[field])}。${field==='L'&&row.L<0?'L 的負值必須保留。':field==='T'?'T = max(0, C − d)。':''}`);}
 const actual=ev[TYPES[q.type].field],raw=w.answers.objective,objOK=raw!==undefined&&raw!==''&&Number.isFinite(Number(raw))&&Math.abs(Number(raw)-actual)<1e-3;if(!objOK)errors.push(`最終目標值應依目前排序計為 ${fmt(actual)}。${q.type==='C'?'先保留每件的負 L，再加總除以 n。':q.type==='D'?'T 算完後取最大，不是相加。':q.type==='E'?'只計 T > 0 的件數，等於交期不算遲交。':''}`);
 const optimal=Math.abs(actual-op.best)<1e-8;if(!optimal)errors.push(`目前排序的 ${TYPES[q.type].objective} 為 ${fmt(actual)}，還能改善到 ${fmt(op.best)}。${TYPES[q.type].rule}`);return{correct:!errors.length,cells,errors,actual,best:op.best,at:Date.now()};}
function storeResult(w,r){const old=rec(w.q.id);saved.records[w.q.id]={...old,attempts:(old.attempts||0)+1,lastAt:Date.now(),resultCorrect:r.correct,mastered:!!(r.correct&&w.stepsDone),needsReview:!r.correct,errors:r.errors.slice(0,12),seq:[...w.seq],mode:w.mode};save();}
function progress(){return header('YOUR LEARNING RECORD','每一步，都算數。','紀錄保存在目前瀏覽器，可匯出備份或帶到其他裝置。',`<div class="actions"><button class="btn" data-export>匯出紀錄 ↓</button><button class="btn" data-import>匯入紀錄 ↑</button><input id="importfile" class="fileinput" type="file" accept="application/json,.json"></div>`)+`<div class="stats"><div class="stat"><span class="statnum">${countMastered()}</span><small>/ 19 已掌握</small></div><div class="stat"><span class="statnum">${Object.values(saved.records).reduce((s,r)=>s+(r.attempts||0),0)}</span><small>次作答</small></div><div class="stat"><span class="statnum">${Object.keys(saved.lessons).length}</span><small>/ 12 觀念自測通過</small></div><div class="stat"><span class="statnum">${Object.values(saved.records).filter(r=>r.needsReview).length}</span><small>題待複習</small></div></div><div class="lowergrid"><section class="panel"><h3>各題型掌握度</h3><div class="progressbars">${Object.entries(TYPES).map(([k,t])=>{const qs=QUESTIONS.filter(q=>q.type===k),n=qs.filter(q=>mastered(q.id)).length;return`<div class="progressrow"><span class="typeletter" style="margin:0;--type:${t.color}">${k}</span><div><div class="small" style="margin-bottom:5px">${t.name}</div><div class="barbg"><i style="width:${n/qs.length*100}%"></i></div></div><span class="muted">${n} / ${qs.length}</span></div>`;}).join('')}</div></section><section class="panel"><h3>如何計算「已掌握」？</h3><p class="small muted">同一次練習中，完成逐步操作，並把排序、計算表和目標值全部答對，就會記為已掌握。</p><p class="small muted">獨立作答或混合測驗的正確結果會另外保留。之後答錯的題目仍會回到錯題本。</p><button class="btn primary" data-start="${saved.last||'A00'}">繼續上次練習 →</button></section></div><section class="panel" style="margin-top:22px"><h3>最近作答</h3>${Object.entries(saved.records).sort((a,b)=>b[1].lastAt-a[1].lastAt).slice(0,10).map(([id,r])=>`<div class="reviewrow"><div><b>${id} · ${TYPES[id[0]].name}</b><p>${new Date(r.lastAt).toLocaleString('zh-TW')} · ${r.mastered?'已掌握':r.resultCorrect?'結果正確':'待複習'}</p></div><button class="btn sm" data-start="${id}">再練一次 →</button></div>`).join('')||'<p class="small muted">還沒有作答紀錄。從一題入門練習開始吧。</p>'}</section>`;}
function review(){const qs=QUESTIONS.filter(q=>rec(q.id).needsReview);return header('LEARN FROM MISTAKES','把卡住的地方，變成進步。','重做並答對後，題目會自動移出待複習清單。')+(qs.length?`<section class="panel">${qs.map(q=>`<div class="reviewrow"><div><span class="qbadge">${q.id}</span><b>　${TYPES[q.type].name} · ${q.year}</b><p>${esc(rec(q.id).errors?.[0]||'回頭檢查計算與排序。')}</p></div><div class="actions"><button class="btn sm primary" data-practice="${q.id}">重做這題 →</button><a class="btn sm" href="#learn/${{A:'bb',B:'bf',C:'rules',D:'rules',E:'moore'}[q.type]}">複習觀念</a></div></div>`).join('')}</section>`:`<div class="empty"><div style="font-size:32px;color:#9daf87">↺</div><h2>目前沒有待複習的題目。</h2><p class="small">開始練習後，錯題與需要注意的計算會出現在這裡。</p><a class="btn primary" href="#bank">前往題型練習 →</a></div>`);}
function sources(){return header('READ, TRACE, VERIFY','每個觀念，都有來處。','上課筆記決定主線，課本補充定義，解答以重算結果為準。')+`<div class="note" style="margin-bottom:22px">第一版包含 12 組觀念筆記、5 題入門與 14 題考古題。下列整理 PDF 可直接下載；原始手寫筆記與整本課本請對照你的本機檔案。</div><div class="sourcelist">${[['排程理論_考試範圍統整.pdf','notes.pdf','16 頁。網站的範圍地圖、方法條件、跨單元整合與勘誤索引。'],['排程理論_五大題型入門解題指南.pdf','beginner.pdf','14 頁。A00–E00 五個自編簡化案例；不是考古題。'],['考古題_分類題目集.pdf','questions.pdf','7 頁。14 題，2019／2022／2023；A、B、C、D 各 3 題，E 有 2 題。'],['考古題_分類解答集.pdf','solutions.pdf','22 頁。與題號一一對應，保留方法並校正中間計算。']].map(([n,file,desc])=>`<details><summary>${n}</summary><p>${desc}</p><p><a class="btn sm" href="assets/${file}" target="_blank" rel="noopener">開啟 PDF ↗</a></p></details>`).join('')}<details open><summary>三份上課筆記與課本對照</summary><p>單元一：8 頁，製程、限制、Johnson、複雜度與啟發式。<br>單元二：18 頁，單機排程 2.1–2.7；課本第 6 章，印刷 p.147–170。<br>單元三：6 頁，共同到期日（Common Due Date，CDD）、交期區間、其他目標與 Moore–Hodgson 演算法；課本第 7.1–7.7 節，印刷 p.171–180。</p><p>課本：Production Planning and Industrial Scheduling_學生.pdf。本次相關章節 PDF 頁碼 = 印刷頁碼 + 19。筆記只列目錄、未展開的單元三 3.8–3.15 不列為已講授計算重點。</p></details><details><summary>批改方式與均勢版本</summary><p>19 題皆在瀏覽器枚舉所有排列核對最佳值：3 件 6 種、4 件 24 種、5 件 120 種。最終作答接受所有達到目標最佳值的排序；計算表必須與自己的排序一致。</p><p>逐步教學展示固定版本：分枝界限法（Branch and Bound，B&B）下界相同取編號小者；前後向啟發式（Backward and Forward Heuristic，B/F）入門倒排均勢取加工時間 p 大者，考古題取編號小者；Forward 採嚴格改善並重新從最大間隔搜尋。Moore 同長度取編號小者。這是為了提供可重現的步驟，不表示其他合法均勢選法錯誤。</p><p>混合測驗評量排序與計算，不聲稱評量完整的 B&B 證明或 B/F 搜尋過程；方法訓練請使用逐步操作。</p></details><details><summary>教材差異與原題重建註記</summary><p>B/F 課堂例：1-4-3-2 成本 490；1-4-2-3 成本 512。CDD 初始排序 D=64 成本 903。交期區間例 P=30，J1 延遲成本為 15。</p><p>考古題 B01 候選 1-3-4-2 成本 57；B02 的 2-1-3-4 成本 46，4-3-2-1 成本 112。D01 須把完工時間對回正確工作。詳見解答集 p.22。</p><p>2019 依可見原題重排；2022、2023 部分由作答卷重建。2022 E 類缺資料，不補造。網站未轉錄同學姓名、學號或成績。</p></details><details><summary>紀錄與備份</summary><p>免登入，作答紀錄存在目前瀏覽器的本機儲存空間（localStorage）。清除瀏覽資料或更換裝置不會自動同步；可於「學習紀錄」匯出／匯入 JSON（JavaScript Object Notation，結構化文字資料格式）備份。原始手寫 PDF 與整本課本未上傳。</p></details></div>`;}
function render(){shell(({home,bank,learn,work,review,progress,sources,diagrams}[state.page]||home)());wireDrag();}
function route(){const[routeName,a,b]=location.hash.slice(1).split('/');const p=routeName||'diagrams';if(state.exam&&p!=='work'){state.exam=null;}state.page=p;if(p==='bank')state.type=Object.keys(TYPES).includes(a)?a:'all';if(p==='learn'){state.lesson=LESSONS.some(l=>l.id===a)?a:'symbols';state.quizResult=null;}if(p==='work'){const id=QUESTIONS.some(q=>q.id===a)?a:'A00';if(!state.work||state.work.q.id!==id||state.work.mode!==(b||'tutorial'))startWork(id,['tutorial','practice','exam'].includes(b)?b:'tutorial');if(state.work.mode==='exam'&&!state.exam){state.work.mode='practice';}}render();window.scrollTo(0,0);}
function navigateWork(id,mode){const hash='#work/'+id+'/'+mode;if(location.hash===hash){startWork(id,mode);render();}else location.hash=hash;}
function updateMastery(w){const r=rec(w.q.id);if(w.stepsDone&&r.resultCorrect&&w.result?.correct){r.mastered=true;saved.records[w.q.id]=r;save();}}
function showDialog(html){const el=document.createElement('div');el.className='dialogback';el.id='dialog';el.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-label="測驗結果">${html}<div class="actions" style="margin-top:22px"><button class="btn primary" data-close-dialog>關閉</button></div></section>`;document.body.append(el);el.querySelector('button')?.focus();}
function startExam(){state.exam={ids:Object.keys(TYPES).map(k=>{const qs=QUESTIONS.filter(q=>q.type===k&&q.kind==='考古題');return qs[Math.floor(Math.random()*qs.length)].id;}),index:0,results:[],started:Date.now()};const id=state.exam.ids[0];startWork(id,'exam');location.hash='#work/'+id+'/exam';render();}
function finishExam(){const e=state.exam;if(!e)return;const correct=e.results.filter(r=>r.result.correct).length,elapsed=Math.round((Date.now()-e.started)/1000);state.exam=null;location.hash='#progress';render();showDialog(`<div class="eyebrow muted">MIXED PRACTICE / RESULTS</div><h2>完成 ${e.results.length} / 5 題。</h2><div class="resultnumber">${correct} 題答對</div><p>用時 ${Math.floor(elapsed/60)} 分 ${elapsed%60} 秒。此測驗核對排序、計算表與目標值；方法過程請另練逐步操作。</p>${e.results.map(({q,result})=>`<div class="reviewrow"><div><b>${q.id} · ${TYPES[q.type].name}　${result.correct?'✓':'待複習'}</b><p>${esc(result.errors[0]||'排序與計算都正確。')}</p></div><button class="btn sm" data-exam-review="${q.id}">看解析</button></div>`).join('')}`);}
document.addEventListener('input',e=>{const w=state.work;if(!w)return;if(e.target.hasAttribute('data-answer'))w.answers[e.target.dataset.answer]=e.target.value;if(e.target.hasAttribute('data-objective'))w.answers.objective=e.target.value;if(e.target.hasAttribute('data-step-field'))w.stepAnswers[e.target.dataset.stepField]=e.target.value;});
document.addEventListener('change',e=>{if(e.target.hasAttribute('data-step-field')&&state.work)state.work.stepAnswers[e.target.dataset.stepField]=e.target.value;if(e.target.id==='mode'){const w=state.work;w.mode=e.target.value;history.replaceState(null,'','#work/'+w.q.id+'/'+w.mode);render();}if(e.target.id==='importfile')importFile(e.target.files[0]);});
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el||el.disabled)return;const d=el.dataset,w=state.work;
 if(d.start){navigateWork(d.start,'tutorial');return;}if(d.practice){navigateWork(d.practice,'practice');return;}if(d.filter){state.type=d.filter;render();return;}if(d.kind){state.kind=d.kind;render();return;}
 if(d.quiz!==undefined){const l=LESSONS.find(l=>l.id===state.lesson);state.quizResult=Number(d.quiz);if(state.quizResult===l.quiz.answer){saved.lessons[l.id]=true;save();}render();return;}
 if('exam'in d){startExam();return;}if('endExam'in d){showDialog('<h2>結束本次測驗？</h2><p>已提交題目會保留，尚未提交的本題不會計分。</p><button class="btn danger" data-confirm-end>結束並看結果</button>');return;}if('confirmEnd'in d){$('#dialog')?.remove();finishExam();return;}
 if('closeDialog'in d){$('#dialog')?.remove();return;}if(d.examReview){$('#dialog')?.remove();navigateWork(d.examReview,'practice');setTimeout(()=>{if(state.work?.q.id===d.examReview){state.work.showSolution=true;state.work.tab='solve';render();}},50);return;}
 if('export'in d){const blob=new Blob([JSON.stringify({version:1,...saved},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='排程研究室_學習紀錄.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);return;}if('import'in d){$('#importfile').click();return;}
 if(!w)return;
 if(d.tab){w.tab=d.tab;render();return;}if('hint'in d){w.hint=Math.min(3,w.hint+1);render();return;}if('resetWork'in d){startWork(w.q.id,w.mode);render();return;}
 if(d.move){const[i,dir]=d.move.split(',').map(Number);moveJob(i,i+dir);return;}
 if('checkStep'in d){const s=w.flow.steps[w.step];w.stepOK=s.fields.every((f,i)=>{const a=w.stepAnswers[i];return a!==undefined&&a!==''&&(typeof f.value==='number'?Math.abs(Number(a)-f.value)<1e-4:String(a)===f.value);});w.stepError=!w.stepOK;render();return;}
 if('nextStep'in d){w.step++;w.stepOK=false;w.stepError=false;w.stepAnswers={};if(w.step===w.flow.steps.length){w.stepsDone=true;updateMastery(w);toast('步驟完成！到工作台提交完整答案。');}render();return;}
 if('submit'in d){const result=grade(w);if(w.mode==='exam'){const fields=['C',w.q.type==='C'?'L':'T',...(['A','B'].includes(w.q.type)?['wT']:[])];if(fields.some(f=>w.seq.some(j=>w.answers[j+'_'+f]===undefined||w.answers[j+'_'+f]===''))||w.answers.objective===undefined||w.answers.objective===''){toast('請先填完所有計算欄位與最終目標值。');return;}storeResult(w,result);state.exam.results.push({q:w.q,result});state.exam.index++;if(state.exam.index===5){finishExam();}else{const id=state.exam.ids[state.exam.index];startWork(id,'exam');location.hash='#work/'+id+'/exam';render();window.scrollTo(0,0);}return;}w.result=result;storeResult(w,result);render();return;}
 if('retry'in d){w.result=null;w.showSolution=false;render();return;}if('solution'in d){w.showSolution=!w.showSolution;render();}
});
function moveJob(from,to){const w=state.work;if(!w||w.result||from===to||to<0||to>=w.seq.length)return;const[j]=w.seq.splice(from,1);w.seq.splice(to,0,j);w.result=null;render();}
function wireDrag(){let dragged=null;$$('.job').forEach(el=>{el.addEventListener('dragstart',e=>{dragged=Number(el.dataset.job);e.dataTransfer.setData('text/plain',String(dragged));e.dataTransfer.effectAllowed='move';el.classList.add('dragging');});el.addEventListener('dragend',()=>{dragged=null;el.classList.remove('dragging');});el.addEventListener('dragover',e=>e.preventDefault());el.addEventListener('drop',e=>{e.preventDefault();if(dragged!==null){const s=state.work.seq;moveJob(s.indexOf(dragged),s.indexOf(Number(el.dataset.job)));}});});}
async function importFile(file){if(!file)return;try{if(file.size>2e6)throw Error();const raw=JSON.parse(await file.text());if(raw.version!==1||!raw.records||typeof raw.records!=='object'||!raw.lessons||typeof raw.lessons!=='object')throw Error();const next=fresh();for(const q of QUESTIONS){const r=raw.records[q.id];if(!r||typeof r!=='object')continue;next.records[q.id]={attempts:Math.max(0,Math.min(1e6,Number(r.attempts)||0)),lastAt:Number(r.lastAt)||0,resultCorrect:r.resultCorrect===true,mastered:r.mastered===true,needsReview:r.needsReview===true,errors:Array.isArray(r.errors)?r.errors.slice(0,12).map(s=>String(s).slice(0,1000)):[],mode:['tutorial','practice','exam'].includes(r.mode)?r.mode:'practice'};}for(const l of LESSONS)if(raw.lessons[l.id]===true)next.lessons[l.id]=true;next.last=QUESTIONS.some(q=>q.id===raw.last)?raw.last:'A00';saved=next;save();render();toast('學習紀錄已匯入。');}catch{toast('匯入失敗：請選擇本站匯出的有效 JSON 紀錄。');}}
window.addEventListener('hashchange',route);document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#dialog')?.remove();});setInterval(()=>{if($('#timer')&&state.exam){const n=Math.floor((Date.now()-state.exam.started)/1000);$('#timer').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}},1000);route();
</script></body></html>
